<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>BQC24 Local</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #111827; color: #f9fafb; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
      h1 { margin-top: 0; }
      a { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .5rem; background: #2563eb; color: white; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
      p { color: #d1d5db; }
    </style>
  </head>
  <body>
    <main>
      <h1>BQC24</h1>
      <p>This local launcher opens the bundled app. The app and its proxy service run on this computer.</p>
      <a href="/bqc24/lilicraftzone/">Open BQC24</a>
    </main>
  </body>
</html>
